---

- name: Add Aerokube Helm repository
  command: helm repo add aerokube https://charts.aerokube.com
  become: false
  register: helm_repo_add
  changed_when: helm_repo_add.rc == 0
  failed_when: helm_repo_add.rc != 0 and 'already exists' not in helm_repo_add.stderr

- name: Install Moon chart
  block:
    - name: Copy values.yaml to remote
      template:
        src: "{{ role_path }}/values.yaml"
        dest: /tmp/moon-values.yaml

    - name: Install Moon chart
      kubernetes.core.helm:
        name: moon
        release_namespace: moon
        chart_ref: aerokube/moon2
        create_namespace: true
        kubeconfig: /home/margo/.kube/config
        values_files:
          - /tmp/moon-values.yaml
      become: false
