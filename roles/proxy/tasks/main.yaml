---
- name: Configure system-wide proxy
  blockinfile:
    path: /etc/environment
    block: |
      HTTP_PROXY={{ proxy_url }}
      HTTPS_PROXY={{ proxy_url }}
      http_proxy={{ proxy_url }}
      https_proxy={{ proxy_url }}
      NO_PROXY={{ no_proxy }}
      no_proxy={{ no_proxy }}
    create: true
